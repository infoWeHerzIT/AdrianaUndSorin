<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teilnehmer – Adriana und Sorin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script src="teilnehmer-table.js"></script>
<style>
  :root {
    --orange: #ff6300;
    --navy: #00224d;
    --white: #ffffff;
    --orange-dim: rgba(255,99,0,0.12);
    --navy-dim: rgba(0,34,77,0.06);
    --green: #16a34a;
    --yellow: #d97706;
    --red: #dc2626;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    background: #f4f4f2;
    color: var(--navy);
    overflow-x: hidden;
    padding-bottom: 80px;
  }

  /* ─── NAV ─── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    padding: 16px 5%;
    background: rgba(0,34,77,0.97);
    backdrop-filter: blur(8px);
  }
  .nav-inner {
    max-width: 1200px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; width: 100%;
  }
  .nav-logo {
    font-family: 'Fredoka', sans-serif;
    color: var(--white); font-size: 18px; font-weight: 700;
    text-decoration: none; display: flex; align-items: center; gap: 10px;
  }
  .nav-logo span { color: var(--orange); }
  .nav-admin-badge {
    font-family: 'Orbitron', monospace;
    font-size: 9px; font-weight: 700;
    letter-spacing: .16em; text-transform: uppercase;
    background: rgba(255,99,0,0.2);
    border: 1px solid rgba(255,99,0,0.4);
    color: var(--orange);
    padding: 3px 8px; border-radius: 2px;
  }
  .nav-links { display: flex; gap: 10px; }
  .nav-link {
    color: rgba(255,255,255,0.6);
    font-size: 13px; text-decoration: none;
    border: 1px solid rgba(255,255,255,0.15);
    padding: 7px 14px; border-radius: 2px;
    transition: background .2s, color .2s; background: transparent;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
  }
  .nav-link:hover { background: rgba(255,255,255,0.08); color: var(--white); }
  .nav-link.active { background: rgba(255,99,0,0.15); border-color: rgba(255,99,0,0.4); color: var(--orange); }

  /* ─── PAGE HEADER ─── */
  .admin-header {
    background: var(--navy);
    padding: 100px 0 60px;
    position: relative; overflow: hidden;
  }
  .admin-header::before {
    content: '';
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(90deg, rgba(255,99,0,0.04) 0px, rgba(255,99,0,0.04) 1px, transparent 1px, transparent 80px);
    pointer-events: none;
  }
  .admin-header::after {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 5px; background: var(--orange);
  }
  .admin-header-inner {
    max-width: 1200px; margin: 0 auto;
    padding: 0 32px;
    position: relative; z-index: 1;
  }
  .admin-page-label {
    font-family: 'Orbitron', monospace;
    font-size: 10px; font-weight: 700;
    letter-spacing: .22em; text-transform: uppercase;
    color: var(--orange); margin-bottom: 14px; display: block;
  }
  .admin-header h1 {
    font-family: 'Fredoka', sans-serif;
    font-size: clamp(28px, 3.5vw, 44px);
    font-weight: 700; color: var(--white);
    line-height: 1.1; margin-bottom: 12px;
  }
  .admin-header h1 em { font-style: normal; color: var(--orange); }
  .admin-header p {
    font-size: 15px; color: rgba(255,255,255,0.55);
    max-width: 560px; line-height: 1.7;
  }
  .wave-bottom {
    position: absolute; bottom: -2px; left: 0; right: 0;
    line-height: 0; pointer-events: none;
  }
  .wave-bottom svg { display: block; width: 100%; }

  /* ─── MAIN ─── */
  .admin-main {
    max-width: 1200px; margin: 0 auto;
    padding: 40px 32px 0;
  }

  /* Komponenten-Styles → teilnehmer-table.js */

  /* ─── TOAST ─── */
  #toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    background: var(--navy); color: var(--white);
    font-size: 14px; padding: 12px 24px;
    border-radius: 2px; white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity .25s; z-index: 999;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  }
  #toast.show { opacity: 1; }
  #toast.error { background: #b91c1c; }
  #toast.success { background: var(--green); }

  /* ─── MOBILE ─── */
  @media (max-width: 640px) {
    .admin-header-inner { padding: 0 20px; }
    .admin-main { padding: 24px 16px 0; }
    .nav-links { display: none; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="admin-login.html" class="nav-logo">
      Adriana &amp; <span>Sorin</span>
      <span class="nav-admin-badge">Admin</span>
    </a>
    <div class="nav-links">
      <a href="admin-events.html" class="nav-link">Events</a>
      <a href="admin-teilnehmer.html" class="nav-link active">Teilnehmer</a>
      <a href="admin-feedback.html" class="nav-link">Feedback</a>
      <a href="admin-users.html" class="nav-link">Admins</a>
      <a href="../kalender.html" target="_blank" class="nav-link">Kalender ↗</a>
      <button id="btn-logout" class="nav-link" style="border-color:rgba(220,38,38,0.4);color:#f87171;">Ausloggen</button>
    </div>
  </div>
</nav>

<div class="admin-header">
  <div class="admin-header-inner">
    <span class="admin-page-label">Teilnehmerverwaltung</span>
    <h1>Alle <em>Anmeldungen</em></h1>
    <p>Übersicht aller Registrierungen. Zahlungsstatus direkt hier ändern.</p>
  </div>
  <div class="wave-bottom">
    <svg viewBox="0 0 1440 40" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <path d="M0 40 C360 0 1080 0 1440 40 L1440 40 L0 40 Z" fill="#f4f4f2"/>
    </svg>
  </div>
</div>

<div class="admin-main">
  <div id="tt-root"></div>
</div>

<div id="toast"></div>

<script>
db.auth.getSession().then(({ data }) => {
  if (!data.session) window.location.href = 'admin-login.html';
});
document.getElementById('btn-logout').addEventListener('click', async () => {
  await db.auth.signOut();
  window.location.href = 'admin-login.html';
});

new TeilnehmerTable(document.getElementById('tt-root'));
</script>
</body>
</html>
